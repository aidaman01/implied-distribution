name: daily

# One snapshot per US trading day at about 15:45 New York (window 15:30-16:15, checked by the script).
# Cron runs in UTC and GitHub often starts it late, so there are three tries per season:
#   summer (EDT, UTC-4): 15:35, 15:50, 16:05 New York = 19:35, 19:50, 20:05 UTC
#   winter (EST, UTC-5): 15:35, 15:50, 16:05 New York = 20:35, 20:50, 21:05 UTC
# The off-season crons land outside the window and exit at once. A trading day gets one row at most.
on:
  schedule:
    - cron: "35 19 * * 1-5"
    - cron: "50 19 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "35 20 * * 1-5"
    - cron: "50 20 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect today's snapshot
        id: collect
        run: python -m rnd.daily
      - name: Commit the data
        if: success() || failure()
        env:
          MESSAGE: ${{ steps.collect.outputs.message }}
        run: |
          if [ ! -d data ]; then
            echo "No data directory yet (no in-window run so far): nothing to commit."
            exit 0
          fi
          git add data/
          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${MESSAGE:-data: update}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in 15 s."
            sleep 15
          done
          echo "::error::Could not push the data commit after 3 attempts."
          exit 1
